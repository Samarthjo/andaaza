name: Test

# GitHub Pages serves the prebuilt site from the root of main (Settings → Pages →
# Deploy from a branch → main → / (root)). Rebuild it with `npm run build:pages`
# and commit the result. This workflow only checks the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
